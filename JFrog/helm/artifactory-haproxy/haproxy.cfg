global
    maxconn 2000
    log stdout format raw local0

defaults
    log global
    option httplog
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend artifactory_frontend
    bind *:8080
    mode http
    default_backend artifactory_backend

backend artifactory_backend
    mode http
    balance roundrobin
    # Health check using JFrog Platform API endpoint
    option httpchk GET /artifactory/api/system/ping
    http-check expect status 200
    # Route to JFrog Platform Artifactory NodePort service
    # The service will internally load balance between replicas
    # MINIKUBE_IP and port numbers will be replaced dynamically by the script
    server artifactory-1 MINIKUBE_IP:NODEPORT_HTTP check inter 3s rise 2 fall 3
    # For multiple replicas, you can add additional servers if needed
    # server artifactory-2 MINIKUBE_IP:NODEPORT_HTTPS check inter 3s rise 2 fall 3

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s

