        chart: jfrog-platform-11.0.5
        heritage: Helm
        release: jfrog-platform
      name: jfrog-platform-pre-upgrade-hook
      annotations:
        "helm.sh/hook": "pre-upgrade"
        "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    spec:
      template:
        metadata:
          labels:
            app: jfrog-platform
            chart: jfrog-platform-11.0.5
            heritage: Helm
            release: jfrog-platform
        spec:
          serviceAccountName: jfrog-platform-rabbitmq-migration
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: Always
            supplementalGroups: []
            sysctls: []
          containers:
            - name: pre-upgrade-container
              image: "releases-docker.jfrog.io/bitnami/kubectl:1.31.2"
              imagePullPolicy: IfNotPresent
              resources:
                limits:
                  cpu: 1
                  memory: 1Gi
                requests:
                  cpu: 5m
                  memory: 10Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 1001
                runAsNonRoot: true
                runAsUser: 1001
                seccompProfile:
                  type: RuntimeDefault
              command:
                - sh
                - -c
                - |
                    #!/bin/sh
                    if [ "$(kubectl get pods -l "app.kubernetes.io/name=rabbitmq" -o jsonpath='{..status.conditions[?(@.type=="Ready")].status}')" = "True" ]; then
                        kubectl exec -it jfrog-platform-rabbitmq-0 -- rabbitmqctl enable_feature_flag all
                        if [ "$?" -ne 0 ]; then
                          echo "Failed to perform the migration. Please make sure to enable the feature flag in rabbitmq manually [rabbitmqctl enable_feature_flag all] "
                          exit 1
                        else
                          echo Feature flags executed successfully!
                        fi
                    else
                        echo "Rabbitmq pod is not in running state. Ignoring feature flag migration for rabbitmq"
                    fi
          restartPolicy: Never
          terminationGracePeriodSeconds: 0
  name: jfrog-platform-pre-upgrade-hook
  path: jfrog-platform/templates/migration-hook.yaml
