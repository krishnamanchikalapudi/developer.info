apiVersion: v1
kind: Namespace
metadata:
  name: oracledb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: oracledb19c-oracle-db
  name: oracledb19c-oracle-db
  namespace: artifactory-oracle
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: Secret
metadata:
  name: oracle-secrets
  namespace: oracledb
  labels:
    app: oracledb
stringData:
  oracle_pwd: Welcome1
type: Opaque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: oracledb19c-oracle-db
  name: oracledb19c-oracle-db
  namespace: artifactory-oracle
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app: oracledb19c-oracle-db
  strategy:
    rollingUpdate:
      maxSurge: 100
      maxUnavailable: 100
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: oracledb19c-oracle-db
    spec:
      containers:
      - env:
        - name: SVC_HOST
          value: oracledb19c-oracle-db
        - name: SVC_PORT
          value: "1521"
        - name: ORACLE_SID
          value: ORCLCDB
        - name: ORACLE_PDB
          value: ORCLPDB1
        - name: ORACLE_PWD
          valueFrom:
            secretKeyRef:
              key: oracle_pwd
              name: oracledb19c-oracle-db
        - name: ORACLE_CHARACTERSET
          value: AL32UTF8
        - name: ORACLE_EDITION
          value: enterprise
        - name: ENABLE_ARCHIVELOG
          value: "false"
        image: psazuse.jfrog.io/oracle-remote/database/free:latest
        imagePullPolicy: IfNotPresent
        name: oracle-db
        ports:
        - containerPort: 1521
          protocol: TCP
        - containerPort: 5500
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - 'if [ -f $ORACLE_BASE/checkDBLockStatus.sh ]; then $ORACLE_BASE/checkDBLockStatus.sh
              ; else $ORACLE_BASE/checkDBStatus.sh; fi '
          failureThreshold: 3
          initialDelaySeconds: 20
          periodSeconds: 40
          successThreshold: 1
          timeoutSeconds: 20
        volumeMounts:
        - mountPath: /opt/oracle/oradata
          name: datamount
      restartPolicy: Always
      securityContext:
        fsGroup: 54321
        runAsUser: 54321
      terminationGracePeriodSeconds: 30
      volumes:
      - name: datamount
        persistentVolumeClaim:
          claimName: oracledb19c-oracle-db
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: oracledb19c-oracle-db
  name: oracledb19c-oracle-db
  namespace: artifactory-oracle
spec:
  ports:
  - name: listener
    nodePort: 32009
    port: 1521
    protocol: TCP
    targetPort: 1521
  - name: xmldb
    nodePort: 31656
    port: 5500
    protocol: TCP
    targetPort: 5500
  selector:
    app: oracledb19c-oracle-db
  type: NodePort
---
